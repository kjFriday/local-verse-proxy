# Checks every push and pull request: the Go code (formatted, vetted,
# tested on Linux, macOS and Windows, on Intel and Arm where GitHub has
# them, with two Go versions; checked for data races; built for six
# systems), the repo-wide rules in internal/archtest, known
# vulnerabilities, a read-only test against a real Postgres, and that
# the bash and Python files still parse.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Each action is pinned to one exact commit (a tag can be moved; a
# commit cannot). The comment names its version.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm and windows-11-arm are Arm; macos-latest
        # is Apple silicon, macos-15-intel an Intel Mac.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest,
          macos-15-intel, windows-latest, windows-11-arm]
        go: ["1.26.x", "1.27.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: gofmt
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "Run gofmt -w on these files:"
            echo "$bad"
            exit 1
          fi
      - name: go mod tidy changes nothing
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go test -race
        run: go test -race ./...
      - name: Repo rules (imports, widths, model names, secrets)
        run: go test -count=1 -v ./internal/archtest
      - name: Build lvp and mint-key for six systems
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=
              if [ "$os" = windows ]; then ext=.exe; fi
              for cmd in lvp mint-key; do
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                  -trimpath -ldflags "-s -w" \
                  -o "dist/$os-$arch/$cmd$ext" "./cmd/$cmd"
              done
            done
          done
          ls -lR dist
      - name: Tests compile for Windows and macOS
        run: |
          for os in windows darwin; do
            for p in $(go list ./...); do
              GOOS=$os go test -c -o /dev/null "$p"
            done
          done
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: bash -n
        run: bash -n mint-key.sh && bash -n tests/mint-parity.sh
      - name: Python compiles
        # The cache goes outside the tree: no __pycache__ in gui/ or
        # game/.
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
            python3 -m compileall -q gui game tests

  pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litellm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: litellm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U litellm -d litellm"
          --health-interval 2s --health-retries 30
    env:
      PGREAD_TEST_URL: >-
        postgresql://litellm:ci-only-password@localhost:5432/litellm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Seed the database
        run: |
          psql "$PGREAD_TEST_URL" -v ON_ERROR_STOP=1 \
            -f internal/pgread/testdata/schema.sql
      - name: go test -tags pg
        run: go test -tags pg -count=1 ./...
