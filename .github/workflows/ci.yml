# Checks every push and pull request: the Go code (formatted, vetted,
# tested on Linux, macOS and Windows, checked for data races, and
# built for six systems), and that the bash and Python files parse.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Each action is pinned to one exact commit (a tag can be moved; a
# commit cannot). The comment names its version.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "Run gofmt -w on these files:"
            echo "$bad"
            exit 1
          fi
      - name: go test -race
        run: go test -race ./...
      - name: Build for six systems
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              exe=mint-key
              if [ "$os" = windows ]; then exe=mint-key.exe; fi
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -o "dist/$os-$arch/$exe" ./cmd/mint-key
            done
          done
          ls -lR dist
      - name: bash -n
        run: bash -n mint-key.sh && bash -n tests/mint-parity.sh
      - name: Python compiles
        run: python3 -m compileall -q gui game
